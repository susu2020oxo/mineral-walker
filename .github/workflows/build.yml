name: Build Mineral Walker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod JAR
        run: gradle clean build --no-daemon

      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mineral-walker-3.0.1-minecraft-26.2-fabric
          path: build/libs/mineral-walker-3.0.1.jar
          if-no-files-found: error
          retention-days: 30
