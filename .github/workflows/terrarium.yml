name: Terrarium 26.3
on:
  push:
    branches: [terrarium-26.3]
    paths: ['src/**', 'resources/**', 'ci/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: python3 ci/build.py
      - run: python3 ci/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: terrarium-26.3-fabric
          path: dist/*.jar
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: terrarium-26.3-fabric
          path: dist
      - name: Publish verified jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create terrarium-v1.2.0 dist/*.jar --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title '生态箱 1.2.0 · Fabric 26.3' --notes '八种平整的 32×32 格主世界生态箱。' --latest=false
