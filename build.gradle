import java.awt.Color
import java.awt.Graphics2D
import java.awt.BasicStroke
import java.awt.image.BufferedImage
import javax.imageio.ImageIO
import groovy.json.JsonOutput

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = project.maven_group
version = project.mod_version
base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// No custom armor items are generated. Equipment-layer textures are supplied for
// original vanilla mineral block items in both chest and leggings slots, plus swords.
def minerals = [
    [id: 'coal_block', name: '煤炭', english: 'Coal', color: 0x454545, drop: 'coal'],
    [id: 'raw_copper_block', name: '粗铜', english: 'Raw Copper', color: 0xA65F42, drop: 'raw_copper'],
    [id: 'copper_block', name: '铜', english: 'Copper', color: 0xC87548, drop: 'copper_ingot'],
    [id: 'quartz_block', name: '石英', english: 'Quartz', color: 0xE8E3D8, drop: 'quartz'],
    [id: 'amethyst_block', name: '紫水晶', english: 'Amethyst', color: 0xA56BCE, drop: 'amethyst_shard'],
    [id: 'raw_iron_block', name: '粗铁', english: 'Raw Iron', color: 0x9A795C, drop: 'raw_iron'],
    [id: 'lapis_block', name: '青金石', english: 'Lapis Lazuli', color: 0x254C9B, drop: 'lapis_lazuli'],
    [id: 'redstone_block', name: '红石', english: 'Redstone', color: 0xA52B25, drop: 'redstone'],
    [id: 'iron_block', name: '铁', english: 'Iron', color: 0xB8B8B8, drop: 'iron_ingot'],
    [id: 'raw_gold_block', name: '粗金', english: 'Raw Gold', color: 0xC49B28, drop: 'raw_gold'],
    [id: 'gold_block', name: '黄金', english: 'Gold', color: 0xF4C52E, drop: 'gold_ingot'],
    [id: 'diamond_block', name: '钻石', english: 'Diamond', color: 0x55E6D0, drop: 'diamond'],
    [id: 'emerald_block', name: '绿宝石', english: 'Emerald', color: 0x16B85B, drop: 'emerald'],
    [id: 'netherite_block', name: '下界合金', english: 'Netherite', color: 0x51413F, drop: 'netherite_ingot']
]

def generatedResources = layout.buildDirectory.dir('generated/mineralwalker-resources')
sourceSets.main.resources.srcDir(generatedResources)

tasks.register('generateMineralGearResources') {
    outputs.dir(generatedResources)
    doLast {
        File root = generatedResources.get().asFile
        root.mkdirs()

        def writeJson = { String relativePath, Object value ->
            File output = new File(root, relativePath)
            output.parentFile.mkdirs()
            output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(value)), 'UTF-8')
        }

        Map<String, String> zh = [:]
        Map<String, String> en = [:]
        def swordIds = []
        def repairIds = []

        minerals.each { mineral ->
            String id = mineral.id
            String swordId = "${id}_sword"
            swordIds << "mineralwalker:${swordId}"
            repairIds << "minecraft:${mineral.drop}"

            zh["item.mineralwalker.${swordId}"] = "${mineral.name}剑"
            en["item.mineralwalker.${swordId}"] = "${mineral.english} Sword"

            writeJson("assets/mineralwalker/items/${swordId}.json", [
                model: [type: 'minecraft:model', model: "mineralwalker:item/${swordId}"]
            ])
            writeJson("assets/mineralwalker/models/item/${swordId}.json", [
                parent: 'minecraft:item/handheld',
                textures: [layer0: "mineralwalker:item/${swordId}"]
            ])

            Color baseColor = new Color((int) mineral.color)

            // Render the same original block item in either armor slot.
            BufferedImage armor = new BufferedImage(64, 32, BufferedImage.TYPE_INT_ARGB)
            Graphics2D ag = armor.createGraphics()
            ag.setColor(baseColor)
            ag.fillRect(0, 0, 64, 32)
            ag.setColor(baseColor.brighter())
            ag.fillRect(0, 0, 64, 3)
            ag.fillRect(0, 0, 3, 32)
            ag.setColor(baseColor.darker())
            ag.fillRect(0, 29, 64, 3)
            ag.fillRect(61, 0, 3, 32)
            ag.setColor(new Color(0, 0, 0, 45))
            for (int x = 8; x < 64; x += 16) ag.drawLine(x, 0, x, 31)
            for (int y = 8; y < 32; y += 8) ag.drawLine(0, y, 63, y)
            ag.setColor(new Color(255, 255, 255, 35))
            ag.fillRect(5, 5, 6, 4)
            ag.fillRect(37, 17, 8, 5)

            // Face details inspired by the supplied gold avatar reference:
            // a red left eye and violet right eye on the helmet's front UV area.
            ag.setColor(new Color(28, 18, 8, 255))
            ag.fillRect(24, 9, 2, 6)
            ag.fillRect(29, 9, 2, 6)
            ag.setColor(new Color(225, 35, 30, 255))
            ag.fillRect(24, 10, 2, 4)
            ag.setColor(new Color(112, 78, 225, 255))
            ag.fillRect(29, 10, 2, 4)
            ag.setColor(new Color(255, 235, 150, 255))
            ag.fillRect(24, 10, 1, 1)
            ag.fillRect(29, 10, 1, 1)

            // Small turquoise fish/diamond badge on the chest front.
            ag.setColor(new Color(0, 70, 82, 255))
            ag.fillRect(21, 23, 6, 6)
            ag.setColor(new Color(0, 151, 166, 255))
            ag.fillRect(22, 23, 4, 5)
            ag.fillRect(20, 24, 2, 3)
            ag.fillRect(26, 24, 2, 3)
            ag.setColor(new Color(110, 242, 236, 255))
            ag.fillRect(23, 22, 2, 1)
            ag.fillRect(23, 27, 2, 1)
            ag.dispose()

            ['humanoid', 'humanoid_leggings'].each { layer ->
                File armorTexture = new File(root, "assets/mineralwalker/textures/entity/equipment/${layer}/${id}.png")
                armorTexture.parentFile.mkdirs()
                ImageIO.write(armor, 'png', armorTexture)
            }

            writeJson("assets/mineralwalker/equipment/${id}.json", [
                layers: [
                    humanoid: [[texture: "mineralwalker:${id}"]],
                    humanoid_leggings: [[texture: "mineralwalker:${id}"]]
                ]
            ])

            // Pixel-art sword icon, tinted to match its source mineral block.
            File swordTexture = new File(root, "assets/mineralwalker/textures/item/${swordId}.png")
            swordTexture.parentFile.mkdirs()
            BufferedImage sword = new BufferedImage(32, 32, BufferedImage.TYPE_INT_ARGB)
            Graphics2D sg = sword.createGraphics()
            sg.setStroke(new BasicStroke(6.0F, BasicStroke.CAP_SQUARE, BasicStroke.JOIN_MITER))
            sg.setColor(new Color(20, 20, 20, 255))
            sg.drawLine(25, 5, 8, 22)
            sg.setStroke(new BasicStroke(3.0F, BasicStroke.CAP_SQUARE, BasicStroke.JOIN_MITER))
            sg.setColor(baseColor)
            sg.drawLine(25, 5, 8, 22)
            sg.setStroke(new BasicStroke(1.0F))
            sg.setColor(baseColor.brighter())
            sg.drawLine(24, 5, 9, 20)
            sg.setStroke(new BasicStroke(4.0F, BasicStroke.CAP_SQUARE, BasicStroke.JOIN_MITER))
            sg.setColor(new Color(65, 45, 30))
            sg.drawLine(7, 23, 3, 27)
            sg.setColor(baseColor.darker())
            sg.drawLine(6, 20, 11, 25)
            sg.setColor(new Color(225, 190, 90))
            sg.setStroke(new BasicStroke(3.0F, BasicStroke.CAP_SQUARE, BasicStroke.JOIN_MITER))
            sg.drawLine(9, 19, 14, 24)
            sg.dispose()
            ImageIO.write(sword, 'png', swordTexture)
        }

        writeJson('assets/mineralwalker/lang/zh_cn.json', zh)
        writeJson('assets/mineralwalker/lang/en_us.json', en)
        writeJson('data/mineralwalker/tags/item/repairs_mineral_gear.json', [
            replace: false,
            values: repairIds.unique()
        ])
        writeJson('data/mineralwalker/tags/block/incorrect_for_mineral_sword.json', [
            replace: false,
            values: []
        ])
        writeJson('data/minecraft/tags/item/swords.json', [
            replace: false,
            values: swordIds
        ])
        writeJson('data/minecraft/tags/item/enchantable/sword.json', [
            replace: false,
            values: swordIds
        ])
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateMineralGearResources')
}
